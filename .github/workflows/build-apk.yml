name: Build APK

on:
  push:
    branches:
      - main
      - feat/helper-port
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt2"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run core tests
        shell: bash
        run: gradle :core:test --stacktrace

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$BUILD_TYPE" = "release" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/NTE-Auction-Assistant-release-unsigned.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/NTE-Auction-Assistant-debug.apk
          fi
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NTE-Auction-Assistant-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## APK build complete"
            echo
            echo "- Trigger: **${{ github.event_name }}**"
            echo "- Build type: **$BUILD_TYPE**"
            echo "- Core tests: **passed**"
            echo "- APK archive validation: **passed**"
            echo "- Android compile/target SDK: **36**"
            echo "- Download: open this workflow run and download the artifact under **Artifacts**"
            if [ "$BUILD_TYPE" = "release" ]; then
              echo "- Note: release APK is **unsigned** and must be signed before normal distribution/install."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
